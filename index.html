 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pick Card Arts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Экран входа -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Вход в игру</h2>
            <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>

    <!-- Основной контент (скрыт до входа) -->
    <div class="game-content" id="gameContent" style="display: none;">
        <!-- Фон -->
        <div class="background" id="background"></div>
        
        <!-- Кнопки в правом верхнем углу -->
        <div class="top-right-buttons">
            <button class="resource-button energy-btn" id="energyBtn"></button>
            <button class="resource-button money-btn" id="moneyBtn"></button>
        </div>
        
        <!-- Нижняя панель -->
<div class="bottom-panel" id="bottomPanel"></div>

    <script src="script.js"></script>
</body>
</html>
